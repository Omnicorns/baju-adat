spring.application.name=peminjaman-baju-adat
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=administrator

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false


server.port=8080

spring.jackson.time-zone=Asia/Jakarta

# Ganti dengan nomor WhatsApp admin penyewaan.
app.whatsapp-admin=6281776541157

# Upload gambar katalog
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.catalog-dir=./uploads/catalog
